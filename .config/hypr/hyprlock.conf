general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/wallpapers/static/w1.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"       # Date
    font_size = 55                    
    font_family = Fira Sans Semibold
    color = rgba(255, 255, 255, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %-d %B')"      # Time
    font_size = 24
    font_family = Fira Sans Semibold
    color = rgba(255, 255, 255, 0.8)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(255, 255, 255, 1.0)   # White ring
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">Password</span></i>
    position = 0, -50
    halign = center
    valign = center

    fail_color = rgb(204, 34, 34)
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    fail_text = <i><span foreground="##ff0000">$FAIL <b>($ATTEMPTS)</b></span></i>
    fail_transition = 300
}
