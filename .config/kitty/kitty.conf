# background transparancy 
background_opacity 0.5

# Scrollback
scrollback_lines	5000



# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font"
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto


# Mouse_hide_wait
mouse_hide_wait	-3.0

# Cursor animation
cursor_trail 200
cursor_trail_start_threshold 2
cursor_trail_decay 0.1 0.4

cursor_shape block
cursor_blink true



# Theme
include current-theme.conf
    # include ~/.cache/wal/colors-kitty.conf

# OS_Wiindow close warning
confirm_os_window_close 0

# Window padding 
window_padding_width 0 5 0 5

# Fish
shell /usr/bin/fish