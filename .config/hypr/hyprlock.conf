general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    # Define a linear curve for consistent speed
    bezier = linear, 1, 1, 0, 0
    
    # Format: animation = <name>, <enabled>, <duration_seconds>, <bezier_curve>
    # Reduced duration from 3 to 0.3 for snappiness
    animation = fadeIn, 1, 0.3, linear
    animation = fadeOut, 1, 0.3, linear
    animation = inputFieldDots, 1, 0.2, linear
} 

background {
    monitor =
    path = ~/wallpapers/static/w4.jpeg
    blur_passes = 3
    blur_size = 7
    brightness = 0.8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"       # Date
    font_size = 55                    
    font_family = Fira Sans Semibold
    color = rgba(255, 255, 255, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %-d %B')"      # Time
    font_size = 24
    font_family = Fira Sans Semibold
    color = rgba(255, 255, 255, 0.8)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(255, 255, 255, 1.0)   # White ring
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    fade_timeout = 1
    placeholder_text = <i><span foreground="##ffffff99">Password</span></i>

    position = 0, -50
    halign = center
    valign = center

    fail_color = rgba(255, 100, 100, 0.9)
    capslock_color = rgba(255, 255, 150, 0.9)
    numlock_color = rgba(150, 200, 255, 0.9)
    bothlock_color = rgba(200, 150, 255, 0.9)
    
    fail_text = <i><span foreground="##ff0000">$FAIL <b>($ATTEMPTS)</b></span></i>
    fail_transition = 300
}